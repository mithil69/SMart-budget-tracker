# =============================================
# Smart Budget Tracker — Spring Boot Backend
# =============================================

# ── Server ──────────────────────────────────
server.port=8081

# ── CORS ─────────────────────────────────────
# Allow requests from the React dev server
allowed.origins=http://localhost:5173

# ── Profile ──────────────────────────────────
# Set to 'h2' for in-memory DB (no MySQL needed)
# Set to 'mysql' for production MySQL
spring.profiles.active=h2

# ── H2 In-Memory Database (default/dev) ──────
spring.datasource.url=jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────
jwt.secret=SmartBudgetTrackerSuperSecretKeyForJWTTokenGeneration2025!
jwt.expiration=86400000

# ── Logging ──────────────────────────────────
logging.level.com.budget=INFO
